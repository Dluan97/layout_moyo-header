<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header>
      <a
        class="logo"
        href="#"
      >
        <img
          src="src/images/logo.png"
          alt="Logo"
        />
      </a>
      <nav>
        <ul class="nav__list">
          <li>
            <a
              class="nav__link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              data-qa="hover"
              href="#"
            >
              Laptops & computers
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Gadgets
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
